<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.supabase.co; media-src https://*.supabase.co; connect-src https://*.supabase.co; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="same-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#6d28d9">
  <title>水晶小舖管理系統</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 登入 -->
  <main id="view-login" class="center">
    <form class="card stack narrow" data-action="login" autocomplete="on">
      <h1>水晶小舖管理系統</h1>
      <div><label class="label" for="login-email">電子郵件</label>
        <input class="input" id="login-email" name="email" type="email" autocomplete="username" required></div>
      <div><label class="label" for="login-password">密碼</label>
        <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn">登入</button>
    </form>
  </main>

  <!-- 兩步驟驗證 -->
  <main id="view-mfa" class="center" hidden>
    <form class="card stack narrow" data-action="mfa">
      <h1>兩步驟驗證</h1>
      <div id="mfa-setup" class="stack" hidden>
        <p class="muted small">第一次使用，請用手機的驗證器 App（Google Authenticator、Microsoft Authenticator 等）掃描下方 QR code，再輸入 App 上顯示的 6 位數驗證碼。</p>
        <img id="mfa-qr" class="qr" alt="驗證器 QR code" width="192" height="192">
        <details class="small muted"><summary>無法掃描？手動輸入金鑰</summary><code id="mfa-secret"></code></details>
      </div>
      <div><label class="label" for="mfa-code">驗證碼（6 位數）</label>
        <input class="input code" id="mfa-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div>
      <button class="btn">確認</button>
      <button class="link" type="button" data-logout>改用別的帳號登入</button>
    </form>
  </main>

  <!-- 沒有權限 -->
  <main id="view-noaccess" class="center" hidden>
    <div class="card stack narrow">
      <h1>沒有存取權限</h1>
      <p class="muted">這個帳號尚未被授權使用本系統，請聯絡店主。</p>
      <button class="btn btn-ghost" type="button" data-logout>登出</button>
    </div>
  </main>

  <!-- 系統主畫面 -->
  <div id="view-app" class="shell" hidden>
    <header class="top"><strong>水晶小舖</strong><button class="link" type="button" data-logout>登出</button></header>
    <main id="page" class="page"></main>
    <nav id="tabs" class="tabs" aria-label="主選單">
      <a href="#/">今日</a>
      <a href="#/sell">售出</a>
      <a href="#/products">商品</a>
      <a href="#/purchases">進貨</a>
      <a href="#/report">報表</a>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/vendor/supabase-js-2.117.3.js"></script>
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/store.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
